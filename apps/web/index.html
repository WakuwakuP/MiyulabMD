<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
      name="viewport"
    >
    <title>MiyulabMD</title>
    <meta content="#2563eb" name="theme-color">
    <link href="/manifest.webmanifest" rel="manifest">
    <script>
    (() => {
      try {
        const stored = localStorage.getItem("miyulabmd:theme") ?? "";
        const root = document.documentElement;
        if (stored === "black") {
          root.dataset.theme = "black";
          root.style.colorScheme = "dark";
        } else {
          delete root.dataset.theme;
          let colorScheme = "light dark";
          if (stored === "light") {
            colorScheme = "light";
          } else if (stored === "dark") {
            colorScheme = "dark";
          }
          root.style.colorScheme = colorScheme;
        }
      } catch {
        /* ignore */
      }
    })();
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=M+PLUS+2:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
