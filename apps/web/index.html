<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>MiyulabMD</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("miyulabmd:theme") ?? "";
          const root = document.documentElement;
          if (stored === "black") {
            root.dataset.theme = "black";
            root.style.colorScheme = "dark";
          } else {
            delete root.dataset.theme;
            root.style.colorScheme =
              stored === "light"
                ? "light"
                : stored === "dark"
                  ? "dark"
                  : "light dark";
          }
        } catch {
          /* ignore */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=M+PLUS+2:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
